[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blower-inspection"
version = "0.1.0"
description = "Python vision inspection system for ultrasonic-welded blower fan parts"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.8",
  "Pillow>=10.0",
  "PyQt6>=6.6",
  "torch>=2.2",
  "torchvision>=0.17",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "pyserial>=3.5"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
industrial = [
  "PyQt6>=6.6",
  "torch>=2.2",
  "torchvision>=0.17",
  "opencv-python>=4.8",
  "numpy>=1.24",
  "Pillow>=10.0",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "pyserial>=3.5",
  "ultralytics>=8.3"
]
tao = [
  "onnxruntime-gpu>=1.18",
  "opencv-python>=4.8",
  "numpy>=1.24"
]

[project.scripts]
blower-inspection = "blower_inspection.cli:main"
blower-inspection-ui = "blower_inspection.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
