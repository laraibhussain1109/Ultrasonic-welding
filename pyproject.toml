[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blower-inspection"
version = "0.1.0"
description = "Python vision inspection system for ultrasonic-welded blower fan parts"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.8",
  "Pillow>=10.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
blower-inspection = "blower_inspection.cli:main"
blower-inspection-ui = "blower_inspection.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
